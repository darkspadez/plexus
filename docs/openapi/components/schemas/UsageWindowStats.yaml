type: object
description: >
  Aggregated totals for one time window (the selected range, or the
  equal-length window immediately preceding it).
properties:
  totalRequests:
    type: integer
    description: Total requests in the window.
  totalErrors:
    type: integer
    description: Total non-success requests in the window.
  totalTokens:
    type: integer
    description: >
      Total tokens (input + output + reasoning + cached + cacheWrite) in
      the window.
  inputTokens:
    type: integer
    description: Total uncached input tokens.
  outputTokens:
    type: integer
    description: Total output tokens.
  reasoningTokens:
    type: integer
    description: Total reasoning tokens.
  cachedTokens:
    type: integer
    description: Total cached input tokens.
  cacheWriteTokens:
    type: integer
    description: Total cache-write tokens.
  totalCost:
    type: number
    description: Total request cost in the window.
  avgDurationMs:
    type: number
    description: Average request duration in milliseconds.
  totalDurationMs:
    type: integer
    description: Sum of all request durations in milliseconds.
  avgTtftMs:
    type: number
    description: Average time to first token in milliseconds.
  avgTokensPerSec:
    type: number
    description: Average reported tokens per second.
  successRate:
    type: number
    description: Percentage of requests whose status is success.
