type: object
additionalProperties: true
description: >
  Public API key metadata returned by ordinary management list, get, status,
  and configuration responses. This breaking management-response change
  intentionally omits `secret`; plaintext credentials are reveal-once and
  appear only in create or rotate responses. Sensitive backup exports are the
  sole exception and must be handled as secrets.
properties:
  fingerprint:
    type: string
    pattern: '^[a-f0-9]{8}$|^unavailable$'
    description: First eight lowercase hexadecimal characters of the secret SHA-256 hash.
  comment:
    type: string
    description: Freeform description or notes about this key. Max 500 characters.
  expiresInMinutes:
    type: integer
    minimum: 1
    description: Original creation lifetime in whole minutes.
  expiresAt:
    type: integer
    format: int64
    readOnly: true
    description: Absolute expiry time as Unix epoch milliseconds.
  disabledAt:
    type: integer
    format: int64
    readOnly: true
  pausedAt:
    type: integer
    format: int64
    readOnly: true
  pauseSource:
    type: string
    enum: [manual, automatic]
    readOnly: true
  pauseReason:
    type: string
    readOnly: true
  anomalyPolicy:
    $ref: ./PerKeyAnomalyPolicy.yaml
  allowedProviders:
    type: array
    items: { type: string }
  excludedProviders:
    type: array
    items: { type: string }
  excludedModels:
    type: array
    items: { type: string }
  allowedModels:
    type: array
    items: { type: string }
  allowRawPassthrough:
    type: boolean
    default: false
  quota:
    type: [string, 'null']
  quotas:
    type: array
    items: { type: string }
