type: object
description: >
  Sensitive reveal-once credential response. Responses include Cache-Control:
  no-store. Persist the secret immediately; it is absent from all later normal
  key and config responses.
required: [name, secret, message]
properties:
  name: { type: string }
  secret:
    type: string
    pattern: '^sk-[a-f0-9]{48}$'
  message: { type: string }
