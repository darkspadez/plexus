<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plexus</title>
    <!--
      Boot script: sets <html data-theme="<theme id>"> before React mounts so the
      first paint matches the saved appearance (no flash). Reads the
      `plexus.appearance` JSON ({ mode, theme, light, dark }); when it is missing
      or invalid, falls back to the legacy `plexus.theme` value ('light' or 'dark'),
      and otherwise to system mode with the Plexus light/dark pair. Any failure
      sets 'plexus-dark'. Mirrors the parse/resolve rules in src/theme/appearance.ts
      (parseAppearance / resolveThemeId); keep them in sync. AppearanceContext
      takes over after mount.
    -->
    <script>
      (function () {
        try {
          var a = null;
          try {
            var v = JSON.parse(localStorage.getItem('plexus.appearance'));
            if (
              v &&
              typeof v === 'object' &&
              (v.mode === 'single' || v.mode === 'system') &&
              typeof v.theme === 'string' && v.theme &&
              typeof v.light === 'string' && v.light &&
              typeof v.dark === 'string' && v.dark
            ) {
              a = v;
            }
          } catch (e) {}
          if (!a) {
            var legacy = localStorage.getItem('plexus.theme');
            a = { mode: 'system', theme: 'plexus-dark', light: 'plexus-light', dark: 'plexus-dark' };
            if (legacy === 'light') {
              a.mode = 'single';
              a.theme = 'plexus-light';
            } else if (legacy === 'dark') {
              a.mode = 'single';
              a.theme = 'plexus-dark';
            }
          }
          var id = a.theme;
          if (a.mode === 'system') {
            id = window.matchMedia('(prefers-color-scheme: dark)').matches ? a.dark : a.light;
          }
          document.documentElement.dataset.theme = id;
        } catch (e) {
          document.documentElement.dataset.theme = 'plexus-dark';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>

</html>
