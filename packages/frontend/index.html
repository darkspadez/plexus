<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plexus</title>
    <!--
      Boot script: sets <html data-theme="<theme id>"> before React mounts so the
      first paint matches the saved appearance (no flash). Reads the
      `plexus.appearance` JSON ({ mode, theme, light, dark }); when it is missing
      or invalid, falls back to the legacy `plexus.theme` value ('light' or 'dark'),
      and otherwise to system mode with the Plexus light/dark pair. Each storage
      read is guarded on its own, so blocked storage behaves like "no value".
      A `custom-*` id renders only if `plexus.themeCache` holds its CSS, which is
      injected as <style id="plexus-custom-themes-boot">; otherwise (and for any
      failure) the Plexus theme for the OS scheme is used. Every non-custom id is
      assumed built-in. Mirrors parseAppearance / resolveThemeId /
      resolveRenderedThemeId in src/theme (a vitest evaluates this script against
      them); keep them in sync. AppearanceContext takes over after mount.
    -->
    <script>
      (function () {
        var dark = true;
        try {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {}
        var fallback = dark ? 'plexus-dark' : 'plexus-light';
        try {
          var read = function (k) {
            try {
              return localStorage.getItem(k);
            } catch (e) {
              return null;
            }
          };
          var a = null;
          try {
            var v = JSON.parse(read('plexus.appearance'));
            if (
              v &&
              typeof v === 'object' &&
              (v.mode === 'single' || v.mode === 'system') &&
              typeof v.theme === 'string' && v.theme &&
              typeof v.light === 'string' && v.light &&
              typeof v.dark === 'string' && v.dark
            ) {
              a = v;
            }
          } catch (e) {}
          if (!a) {
            var legacy = read('plexus.theme');
            a = { mode: 'system', theme: 'plexus-dark', light: 'plexus-light', dark: 'plexus-dark' };
            if (legacy === 'light') {
              a.mode = 'single';
              a.theme = 'plexus-light';
            } else if (legacy === 'dark') {
              a.mode = 'single';
              a.theme = 'plexus-dark';
            }
          }
          var id = a.mode === 'system' ? (dark ? a.dark : a.light) : a.theme;
          // Inject every cached custom theme (at most 3), not just the resolved
          // one: in system mode the OS scheme can flip before the list loads.
          var cache = null;
          try {
            cache = JSON.parse(read('plexus.themeCache'));
          } catch (e) {}
          var css = '';
          var cachedResolved = false;
          if (cache && typeof cache === 'object') {
            for (var key in cache) {
              if (
                Object.prototype.hasOwnProperty.call(cache, key) &&
                typeof cache[key] === 'string' &&
                cache[key]
              ) {
                css += cache[key] + '\n';
                if (key === id) cachedResolved = true;
              }
            }
          }
          if (css) {
            var el = document.createElement('style');
            el.id = 'plexus-custom-themes-boot';
            el.textContent = css;
            document.head.appendChild(el);
          }
          if (id.indexOf('custom-') === 0 && !cachedResolved) id = fallback;
          document.documentElement.dataset.theme = id;
        } catch (e) {
          document.documentElement.dataset.theme = fallback;
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>

</html>
